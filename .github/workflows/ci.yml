name: CI

on:
  # Avoid duplicate push and pull_request runs on feature branches.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Setup Node.js 24 for the isolated example
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate standalone Identity & Access in a clean directory
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cp -R examples/identity-access "$scratch/identity-access"
          cd "$scratch/identity-access"
          npm ci
          npm run typecheck
          npm test
