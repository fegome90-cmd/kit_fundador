name: LEGO auth dependency bootstrap (temporary)
on:
  push:
    branches: [feat/lego-auth]
    paths:
      - .github/workflows/lego-auth-bootstrap.yml
      - addons/auth-better-auth/package.json
      - addons/auth-better-auth/src/auth-schema.ts
permissions:
  contents: read
jobs:
  lock-and-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproducible lock and generated Drizzle SQL in no-write CI
        shell: bash
        run: |
          set -euo pipefail
          cd addons/auth-better-auth
          pnpm install --ignore-scripts --strict-peer-dependencies
          pnpm exec drizzle-kit generate --name=init
          test -s pnpm-lock.yaml
          test -s drizzle/meta/_journal.json
          echo LOCK_BEGIN
          base64 -w 2048 pnpm-lock.yaml | sed 's/^/LOCK_CHUNK:/'
          echo LOCK_END
          echo GENERATED_BEGIN
          while IFS= read -r path; do
            echo "FILE_PATH:$path"
            base64 -w 2048 "$path" | sed 's/^/FILE_CHUNK:/'
            echo FILE_END
          done < <(find drizzle -type f | sort)
          echo GENERATED_END
