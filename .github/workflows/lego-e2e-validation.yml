name: LEGO E2E Validation (experimental)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/fastify-lego-foundation
    paths:
      - '.github/workflows/lego-e2e-validation.yml'
      - 'dev-docs/validation/2026-10-13-work/prototype/ci/**'
      - 'dev-docs/validation/2026-10-13-work/prototype/src/**'
      - 'dev-docs/validation/2026-10-13-work/prototype/drizzle/**'
      - 'dev-docs/validation/2026-10-13-work/ui6/**'
      - 'dev-docs/validation/2026-10-13-work/registry.py'
      - 'dev-docs/validation/2026-10-13-work/lego_safe.py'
      - 'dev-docs/validation/2026-10-13-work/verify_assembled.mjs'

permissions:
  contents: read

concurrency:
  group: lego-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-auth-queue:
    name: PostgreSQL + Better Auth + BullMQ A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: lego_ci
          POSTGRES_PASSWORD: lego_ci_ephemeral_only
          POSTGRES_DB: legolab
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U lego_ci -d legolab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      valkey:
        image: valkey/valkey:8.1.4
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        shell: bash
        working-directory: dev-docs/validation/2026-10-13-work/prototype
    env:
      DATABASE_URL: postgresql://lego_ci:lego_ci_ephemeral_only@127.0.0.1:55432/legolab
      AUTH_URL: http://127.0.0.1:4310
      CI: 'true'
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select security-patched Swagger UI fixture and install exact lockfile
        run: |
          cp ../ui6/package.json ./package.json
          cp ../ui6/pnpm-lock.yaml ./pnpm-lock.yaml
          cp ../ui6/pnpm-workspace.yaml ./pnpm-workspace.yaml
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Confirm service versions
        run: |
          node --version
          pnpm --version
          node -e 'console.log("Fastify version", require("fastify/package.json").version)'
          node -e 'console.log("BullMQ version", require("bullmq/package.json").version)'
      - name: Compile fixture (application strict; known upstream declarations skipped)
        run: pnpm exec tsc --skipLibCheck
      - name: Recheck standalone Fastify and OpenAPI
        run: node --test tests/http.test.mjs
      - name: Apply Drizzle migrations against live PostgreSQL (twice for idempotence)
        run: |
          pnpm exec drizzle-kit migrate
          pnpm exec drizzle-kit migrate
      - name: Apply BullMQ PostgreSQL migrations against live PostgreSQL (twice)
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import { runMigrations } from 'bullmq';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            for (let i = 1; i <= 2; i++) {
              const client = await pool.connect();
              try { await runMigrations(client); console.log('BULLMQ_PG_MIGRATION_PASS', i); }
              finally { client.release(); }
            }
          } finally { await pool.end(); }
          NODE
      - name: Integration — real PostgreSQL, Better Auth sessions, BullMQ PG worker
        run: node --test ci/full-pg.test.mjs
      - name: Regression — BullMQ Valkey worker behaviors
        run: node --test tests/jobs.test.mjs
      - name: LEGO assembled consumers — live PostgreSQL, Better Auth and independent workers
        run: |
          set -euo pipefail
          cd ..
          ROOT="$PWD"
          LAB="$(mktemp -d)"
          HTTP_PID=""
          cleanup() {
            if [[ -n "$HTTP_PID" ]]; then kill "$HTTP_PID" 2>/dev/null || true; fi
            rm -rf "$LAB"
          }
          trap cleanup EXIT
          python3 registry.py
          python3 -m http.server 4380 --bind 127.0.0.1 --directory registry > "$LAB/http.log" 2>&1 &
          HTTP_PID=$!
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4380/core-fastify.json >/dev/null; then break; fi
            sleep 0.25
          done
          curl --silent --fail http://127.0.0.1:4380/core-fastify.json >/dev/null
          CLI="$ROOT/prototype/node_modules/shadcn/dist/index.js"
          for variant in a b; do
            CONSUMER="$LAB/consumer-$variant"
            mkdir -p "$CONSUMER"
            printf '{"name":"lego-integrated-%s","version":"0.0.0","private":true,"type":"module","packageManager":"pnpm@11.25.0"}\n' "$variant" > "$CONSUMER/package.json"
            cp prototype/pnpm-workspace.yaml "$CONSUMER/pnpm-workspace.yaml"
            python3 lego_safe.py --project "$CONSUMER" --registry http://127.0.0.1:4380 --items "lego-full-$variant" --install --allow-http-localhost --shadcn-cli "$CLI"
            (cd "$CONSUMER" && pnpm install --frozen-lockfile --strict-peer-dependencies && pnpm exec tsc --skipLibCheck && pnpm exec drizzle-kit migrate)
            node verify_assembled.mjs "$CONSUMER" "$variant"
            # Verify production runtime really functions with no optional/dev packages.
            (cd "$CONSUMER" && pnpm install --prod --no-optional --frozen-lockfile --strict-peer-dependencies && pnpm audit --prod --no-optional --json > "$LAB/pruned-audit-$variant.json")
            node verify_assembled.mjs "$CONSUMER" "$variant"
            echo "ASSEMBLED_PRUNED_PRODUCTION_RUNTIME_PASS $variant"
          done
      - name: Comparative smoke benchmark — PostgreSQL vs Valkey on the same runner
        run: node ci/benchmark-ab.mjs
      - name: Record dependency advisory status (non-blocking until triaged)
        if: always()
        continue-on-error: true
        run: pnpm audit --json > ci-audit.json
      - name: Upload isolated experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lego-e2e-${{ github.run_id }}
          path: |
            dev-docs/validation/2026-10-13-work/prototype/ci-audit.json
            dev-docs/validation/2026-10-13-work/prototype/ci-benchmark-ab.json
          if-no-files-found: ignore
          retention-days: 7
