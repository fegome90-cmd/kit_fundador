name: LEGO PostgreSQL bootstrap (temporary)
on:
  push:
    branches: [feat/lego-postgres]
    paths:
      - .github/workflows/lego-postgres-bootstrap.yml
      - addons/db-postgres/package.json
      - addons/db-postgres/src/schema.ts
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve immutable lock and generate Drizzle SQL (no repo write permissions)
        run: |
          set -euo pipefail
          cd addons/db-postgres
          pnpm install --ignore-scripts --strict-peer-dependencies
          pnpm exec drizzle-kit generate --name=init
          test -s pnpm-lock.yaml
          test -d drizzle
          echo 'LEGO_LOCK_BEGIN'
          base64 -w 2048 pnpm-lock.yaml | sed 's/^/LOCK_CHUNK:/'
          echo 'LEGO_LOCK_END'
          echo 'LEGO_DRIZZLE_BEGIN'
          while IFS= read -r file; do
            echo "FILE_PATH:$file"
            base64 -w 2048 "$file" | sed 's/^/FILE_CHUNK:/'
            echo 'FILE_END'
          done < <(find drizzle -type f | sort)
          echo 'LEGO_DRIZZLE_END'
