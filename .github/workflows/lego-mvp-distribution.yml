name: LEGO MVP distribution (isolated)

on:
  workflow_dispatch:
  push:
    branches: [feat/fastify-lego-foundation]
    paths:
      - .github/workflows/lego-mvp-distribution.yml
      - templates/fastify-core/**
      - templates/fastify-openapi/**
      - dev-docs/plans/lego-mvp-distribution-2026-10-15.md

permissions:
  contents: read

jobs:
  template-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        template: [fastify-core, fastify-openapi]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require committed and non-empty dependency lockfile
        run: test -s "templates/${{ matrix.template }}/pnpm-lock.yaml"
      - name: Standalone frozen install
        run: |
          cd "templates/${{ matrix.template }}"
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Strict typecheck and compiled HTTP tests
        run: |
          cd "templates/${{ matrix.template }}"
          pnpm run typecheck
          pnpm test
      - name: Dependency boundaries
        run: |
          cd "templates/${{ matrix.template }}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const deps=Object.keys(p.dependencies).sort();
          const expected=process.env.TEMPLATE==='fastify-core'
            ? ['fastify']
            : ['@fastify/swagger','@fastify/swagger-ui','fastify'];
          if(JSON.stringify(deps)!==JSON.stringify(expected))throw new Error('Unexpected runtime deps: '+deps);
          if(p.packageManager!=='pnpm@11.25.0'||p.type!=='module')throw new Error('Unexpected install/runtime config');
          const scripts=Object.values(p.scripts||{}).join(' ');
          if(/postinstall|preinstall|prepare|degit|shadcn/.test(scripts))throw new Error('Unexpected install side effect');
          console.log('BOUNDARY_PASS',p.name,JSON.stringify(deps));
          NODE
        env:
          TEMPLATE: ${{ matrix.template }}
      - name: Check production dependency advisories (no optional deps)
        run: |
          cd "templates/${{ matrix.template }}"
          pnpm audit --prod --no-optional
      - name: Download the published template by exact GitHub commit SHA (giget)
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          LAB="$(mktemp -d)"
          trap 'rm -rf "$LAB"' EXIT
          SOURCE="gh:$GITHUB_REPOSITORY/templates/${{ matrix.template }}#$GITHUB_SHA"
          TARGET="$LAB/copied-backend"
          pnpm dlx giget@3.3.1 "$SOURCE" "$TARGET"
          for relative in package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json src/app.ts src/server.ts; do
            cmp "templates/${{ matrix.template }}/$relative" "$TARGET/$relative"
          done
          test ! -f "$TARGET/../package.json"
          test ! -e "$TARGET/node_modules"
          (cd "$TARGET" &&
            pnpm install --frozen-lockfile --strict-peer-dependencies &&
            pnpm run typecheck &&
            pnpm test)
          echo "MVP_GIGET_SHA_BOOTSTRAP_PASS $SOURCE"
          mkdir "$LAB/occupied"
          echo PRESERVE_ME > "$LAB/occupied/consumer-file.txt"
          if pnpm dlx giget@3.3.1 "$SOURCE" "$LAB/occupied" > "$LAB/giget-error.log" 2>&1; then
            echo "Unexpected overwrite of nonempty target" >&2
            exit 1
          fi
          test "$(cat "$LAB/occupied/consumer-file.txt")" = PRESERVE_ME
          echo "MVP_OCCUPIED_DESTINATION_REJECTED"
      - name: Retain independently resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-${{ matrix.template }}-lock-${{ github.run_id }}
          path: templates/${{ matrix.template }}/pnpm-lock.yaml
          retention-days: 7
          if-no-files-found: error
