name: One-time LEGO MVP branch isolation

on:
  push:
    branches: [feat/fastify-lego-foundation]
    paths:
      - .github/workflows/lego-mvp-isolate-pr.yml

permissions:
  contents: write

jobs:
  isolate-reviewed-mvp:
    if: github.ref == 'refs/heads/feat/fastify-lego-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source with enough history for main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create a clean branch from main with ONLY MVP scope
        run: |
          set -euo pipefail
          git fetch origin main
          if git ls-remote --exit-code --heads origin feat/lego-mvp-scaffold >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing MVP branch" >&2
            exit 1
          fi
          SOURCE="$GITHUB_SHA"
          git switch --create feat/lego-mvp-scaffold origin/main
          git restore --source="$SOURCE" --staged --worktree -- \
            templates/fastify-core \
            templates/fastify-openapi \
            .github/workflows/lego-mvp-distribution.yml \
            LEGO-MVP.md \
            dev-docs/plans/lego-mvp-distribution-2026-10-15.md \
            dev-docs/validation/2026-10-15-mvp-distribution/report.md
          git diff --cached --check
          git diff --cached --name-only | tee /tmp/lego-mvp-file-list.txt
          if grep -Ev '^(templates/fastify-(core|openapi)/|\.github/workflows/lego-mvp-distribution\.yml$|LEGO-MVP\.md$|dev-docs/plans/lego-mvp-distribution-2026-10-15\.md$|dev-docs/validation/2026-10-15-mvp-distribution/report\.md$)' /tmp/lego-mvp-file-list.txt; then
            echo "Unexpected changes outside audited MVP" >&2
            exit 1
          fi
          test "$(grep -c '^templates/' /tmp/lego-mvp-file-list.txt)" -ge 20
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(lego): isolated Fastify Core and OpenAPI starters"
          git push origin HEAD:refs/heads/feat/lego-mvp-scaffold
          echo "MVP_ISOLATED_BRANCH_COMMIT $(git rev-parse HEAD)"
